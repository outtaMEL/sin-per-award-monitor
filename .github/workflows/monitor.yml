name: SIN-PER Award Monitor

on:
  schedule:
    # 每 3 小时查一次（UTC）。北京时间约 08:00 / 11:00 / 14:00 …
    - cron: "0 */3 * * *"
  workflow_dispatch:

concurrency:
  group: award-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .monitor_state.json
          key: monitor-state-v1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps
          sudo apt-get update && sudo apt-get install -y xvfb

      - name: Restore Cloudflare session
        env:
          PLAYWRIGHT_STORAGE_STATE: ${{ secrets.PLAYWRIGHT_STORAGE_STATE }}
          SEATS_AERO_COOKIES: ${{ secrets.SEATS_AERO_COOKIES }}
          SEATS_AERO_COOKIES_B64: ${{ secrets.SEATS_AERO_COOKIES_B64 }}
        run: |
          if [ -n "$PLAYWRIGHT_STORAGE_STATE" ]; then
            echo "$PLAYWRIGHT_STORAGE_STATE" | base64 -d > storage_state.json
            echo "storage_state.json 已恢复"
          fi
          if [ -n "$SEATS_AERO_COOKIES_B64" ]; then
            echo "SEATS_AERO_COOKIES=$(echo "$SEATS_AERO_COOKIES_B64" | base64 -d)" >> "$GITHUB_ENV"
            echo "Cookie 已从 B64 恢复"
          elif [ -n "$SEATS_AERO_COOKIES" ]; then
            echo "已配置 SEATS_AERO_COOKIES"
          elif [ ! -f storage_state.json ]; then
            echo "::warning::未设置 PLAYWRIGHT_STORAGE_STATE，查票可能失败"
          fi

      - name: Run monitor
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SEATS_AERO_COOKIES: ${{ env.SEATS_AERO_COOKIES || secrets.SEATS_AERO_COOKIES }}
          ORIGIN: SIN
          DESTINATION: PER
          DATE_START: "2026-06-28"
          DATE_END: "2026-07-06"
          MAX_BUSINESS_MILES: "70000"
          HEADLESS: "false"
          GITHUB_ACTIONS: "true"
          NOTIFY_ON_ERROR: "false"
        run: xvfb-run -a python monitor.py --once
